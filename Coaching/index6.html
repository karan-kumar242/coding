<div class="container py-5">

  <h2 class="text-center mb-4">📞 Contact Us</h2>

  <div class="row g-4">

    <!-- Contact Info -->
    <div class="col-lg-4">
      <div class="card p-4 text-center">
        <div class="icon-box mb-2">
          <i class="fa fa-phone"></i>
        </div>
        <h5>Phone</h5>
        <p>+91 8434085292</p>
      </div>

      <div class="card p-4 text-center mt-3">
        <div class="icon-box mb-2">
          <i class="fa fa-envelope"></i>
        </div>
        <h5>Email</h5>
        <p>karan Coding Ott @gamil.com</p>
      </div>

      <div class="card p-4 text-center mt-3">

    <div class="col-lg-8">

        <input type="text" class="form-control mb-3" placeholder="Your Name">
        <input type="email" class="form-control mb-3" placeholder="Your Email">
        <input type="text" class="form-control mb-3" placeholder="Subject">

        <textarea class="form-control mb-3" rows="5" placeholder="Your Message" id="mh"></textarea>

        <button class="btn btn-success w-100" onclick="send()">Send Message</button>
      </div>
    </div>

<script>
 function send() {
  let msg = document.getElementById("mh").value.trim();

  if (msg === "") {
    alert("Please write the message");
  } else {
    alert("Message is successfully sent");
  }
}
</script>
