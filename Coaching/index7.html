<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#0f172a;
      color:#fff;
    }

    .card{
      background:#020617;
      border:1px solid #1e293b;
      border-radius:15px;
    }

    .green{
      color:#22c55e;
      font-weight:bold;
    }

    input{
      background:#0f172a !important;
      border:1px solid #334155 !important;
      color:#fff !important;
    }

    input:focus{
      box-shadow:none !important;
      border-color:#22c55e !important;
    }

    .btn-success{
      background:#22c55e;
      border:none;
    }
  </style>
</head>

<body>
  <div class="modal fade" id="buyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Scan & Pay (PhonePe / UPI)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body text-center">

        <p class="mb-2">Scan this QR using PhonePe, Google Pay, Paytm</p>

        
        <img 
          src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=yourupi@upi&pn=YourName&am=100&cu=INR"
          alt="UPI QR Code"
          class="img-fluid border rounded p-2"
        />

        <p class="mt-3 text-muted">
          UPI ID: <b>9771882013</b>
        </p>

        <p class="text-danger small">
          Amount: ₹5999
        </p>

      </div>

      
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button class="btn btn-success">I Have Paid</button>
      </div>

    </div>
  </div>
</div>


<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-6">

      <div class="card p-4 shadow-lg">

        <h2 class="text-center mb-3" style="color: white;">💳 Payment Page</h2>

        <p class="text-center" style="color: white;">
          Course: <span class="green">Cohort 2.0</span>
        </p>

        <h3 class="text-center green mb-4">₹5999</h3>

        <form>

          <div class="mb-3">
            <label class="form-label" style="color: white;">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>

          <div class="mb-3">
            <label class="form-label" style="color: white;">Mobile Number</label>
            <input type="text" class="form-control" placeholder="Enter phone number">
          </div>

          <div class="mb-3">
            <label class="form-label" style="color: white;">Email</label>
            <input type="email" class="form-control" placeholder="Enter email">
          </div>

          <div class="mb-3">
            <label class="form-label" style="color: white;">Payment Method</label>
            <select class="form-control">
              <option>Phonepay</option>
              <option>NaviUpi</option>
              <option>GooglePay</option>
            </select>
          </div>

         
        </form>
         <button type="button" class="btn btn-success me-2 px-4 fw-semibold" data-bs-toggle="modal" data-bs-target="#buyModal">
  🚀 Buy Now
</button>
        <p class="text-center mt-3 " style="color: white;">
            Secure Payment Gateway
        </p>

      </div>

    </div>

  </div>

</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
