<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
    }

    
    .navbar {
      background-color: #020617 !important;
    }

    .navbar .nav-link {
      color: #cbd5f5 !important;
      font-weight: 500;
      padding: 8px 12px;
      transition: 0.3s;
    }

    .navbar .nav-link:hover {
      color: #22c55e !important;
    }

    nav img {
      height: 40px;
      border-radius: 50%;
    }

    .mine {
      height: 35px;
      width: 35px;
      border-radius: 50%;
    }

    .tag h4 {
      background: #1e293b;
      color: #cbd5f5;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      display: inline-block;
      margin: 5px;
    }

    
    .green {
      color: #22c55e;
      font-weight: bold;
    }

    .gray {
      text-decoration: line-through;
      color: #94a3b8;
    }

    .chatbot{
      position: fixed;
      right: 20px;
      bottom: 90px;
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius:15px;
      box-shadow: 0 0 128px rgba(0,0,0,0.1),0 32px 64px -48 rgba(0,0,0,0.5);
    }
    @media (max-width: 576px){
      .chatbot{
        right: 0;
        bottom: 0;
        width: 100%;
    max-width: 100%;
    height: 100%;
        border-radius: 0;
      }
    }

    .chatbot header{
      background-color: #724ae8;
      padding: 12px;
      text-align: center;
    }

    .chatbot header h2{
      color:#fff;
      font-size: 1.2rem;
      margin: 0;
    }

    .chatbox{
      height: 60vh;
      overflow-y: auto;
      padding: 20px;
    }

    .chat{
      display: flex;
      margin-bottom: 10px;
    }

    .chat p{
      max-width: 75%;
      font-size: 0.9rem;
      padding: 10px 14px;
      border-radius: 10px;
    }

    .incoming p{
      background: #f2f2f2;
      color:#000;
      border-radius: 10px 10px 10px 0;
    }

    .outgoing{
      justify-content: end;
    }

    .outgoing p{
      background: #724ae8;
      color: #fff;
      border-radius: 10px 10px 0 10px;
    }

    .chat-input{
      border-top: 1px solid #ccc;
      padding: 10px;
    }

    .chat-input textarea{
      height: 50px;
      resize: none;
    }

    .chatbot-toggler{
      position: fixed;
      right:20px;
      bottom: 20px;
      height: 50px;
      width: 50px;
      border-radius: 50%;
      background: #724ae8;
      color: #fff;
      border: none;
    }
  </style>
</head>

<body>
 

  <button class="chatbot-toggler btn d-flex align-items-center justify-content-center">
    💬
  </button>
  <div class="chatbot d-flex flex-column">
    <header>
      <h2>chat with AI agent karan</h2>
    </header>
    <ul class="chatbox list-unstyled flex-grow-1">
      
      <li class="chat incoming">
        <p>Hi there <br>How can I help you today?</p>
      </li>

    </ul>
    <div class="chat-input">
      <div class="input-group">
        <textarea class="form-control" placeholder="Enter message..."></textarea>
        <button class="btn btn-primary">Send</button>
      </div>
    </div>

  </div>
 

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const chatInput = document.querySelector(".chat-input textarea");
const sendChatBtn = document.querySelector(".chat-input button");
const chatbox = document.querySelector(".chatbox");

let userMessage;
const API_KEY = "";
const randomReplies = [
  "Hello 👋, main Karan Kumar AI Agent hoon. Aapki help ke liye yahan hoon 😊",
  
  "Kaise ho aap? Agar kisi cheez me help chahiye ho to bata sakte ho 👍",
  
  "Haan, main samajh gaya aap kya kehna chah rahe ho. Thoda aur detail me bataoge to main better help kar paunga 🙂",
  
  "Main Karan Kumar AI Agent hoon 🤖 aur main aapke sawalon ka best possible answer dene ki koshish karta hoon.",
  
  "Ye kaafi interesting baat hai 🤔, kya aap iske baare me thoda aur explain kar sakte ho?",
  
  "Nice 👍, aapka input kaafi acha hai. Main isko process kar raha hoon...",
  
  "Mujhe lagta hai aap sahi direction me ja rahe ho 🔥, bas thoda aur clarity chahiye.",
  
  "Great! 😄 Ye sunke acha laga. Agar aap chaho to main aur bhi help kar sakta hoon.",
  
  "Bilkul sahi 💯, aapne ek important point uthaya hai.",
  
  "Okay 👍, main isko samajh raha hoon. Aap apna next question pooch sakte ho.",
  
  "Aapka question kaafi interesting hai 😊, main aapko best possible answer dene ki koshish kar raha hoon.",
  
  "Thoda ruk jaiye... main isko analyze kar raha hoon 🤖",
  
  "Mujhe lagta hai isme aur bhi possibilities ho sakti hain 🤔, aap kya sochte ho?",
  "Theek hai 👍 main samajh gaya, ab next step batiye kya karna hai?",
  
  "Interesting 🤖 isme multiple possibilities ho sakti hain, aap kya sochte ho?",
  
  "Wait kariye ⏳ main analyze kar raha hoon aur best answer la raha hoon...",
  
  "Good question 🔥 is topic ko thoda deep me samajhna padega.",
  "I think hum isko aur simple bana sakte hain 😄 | Great point 👍 ab isko practically implement karte hain | Let me think 🤖 iska best output nikalte hain...",
  "Hmm 🤔 ye thoda complex lag raha hai | Isko simple steps me convert karte hain 👍 | Let me calculate best result...",
  "Waah waah 👏 kya baat hai | Is problem me thoda tadka lagate hain 🌶️ | Main ab full power se solve kar raha hoon ⚡",
  "Na sirf code, na sirf logic ka khel hai 🧠 | Karan AI Agent ka apna hi ek mel hai 🎭 | Har jawab me thoda junoon, thodi si baato ka jheel hai 🌊"
];

const createChatLi = (message, className) => {
  const chatLi = document.createElement("li");
  chatLi.classList.add("chat", className);

  let chatContent =
    className === "outgoing"
      ? `<p>${message}</p>`
      : `<span class="material-symbols-outlined"></span><p>${message}</p>`;

  chatLi.innerHTML = chatContent;
  return chatLi;
};

// ✅ UPDATED FUNCTION (No API, Random reply)
const generateResponse = (incomingChatLi) => {
  const messageElement = incomingChatLi.querySelector("p");

  setTimeout(() => {
    const randomText =
      randomReplies[Math.floor(Math.random() * randomReplies.length)];

    messageElement.textContent = randomText;
    chatbox.scrollTo(0, chatbox.scrollHeight);
  }, 800);
};

const handleChat = () => {
  userMessage = chatInput.value.trim();
  if (!userMessage) return;

  // user message show
  chatbox.appendChild(createChatLi(userMessage, "outgoing"));
  chatInput.value = "";
  chatbox.scrollTo(0, chatbox.scrollHeight);

  const incomingChatLi = createChatLi("Thinking...", "incoming");
  chatbox.appendChild(incomingChatLi);
  chatbox.scrollTo(0, chatbox.scrollHeight);

  // same delay
  setTimeout(() => {
    generateResponse(incomingChatLi);
  }, 600);
};

sendChatBtn.addEventListener("click", handleChat);
</script>
</html>
